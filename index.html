<canvas id="particleCanvas"></canvas>

<script>
/* ===== 主题切换 ===== */
const root = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
function initTheme(){
  const saved = localStorage.getItem('xt-theme');
  if(saved){ root.setAttribute('data-theme', saved); return; }
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
}
function paintTheme(){
  const cur = root.getAttribute('data-theme');
  themeBtn.textContent = cur === 'dark' ? '☀' : '☾';
}
themeBtn.addEventListener('click', () => {
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  localStorage.setItem('xt-theme', next);
  paintTheme();
});

/* ===== 粒子流动背景 ===== */
(function(){
  const canvas = document.getElementById('particleCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, particles = [], mouse = {x:null, y:null};
  const PARTICLE_COUNT = 50;
  const CONNECT_DIST = 100;
  const MOUSE_DIST = 120;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  function getColor(){
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    return dark ? 'rgba(41,151,255,' : 'rgba(5,109,232,';
  }
  function initParticles(){
    particles = [];
    for(let i=0;i<PARTICLE_COUNT;i++){
      particles.push({
        x: Math.random()*W,
        y: Math.random()*H,
        vx: (Math.random()-0.5)*0.3,
        vy: (Math.random()-0.5)*0.3,
        r: Math.random()*2+1
      });
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    const baseColor = getColor();
    for(let p of particles){
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = baseColor + '0.5)';
      ctx.fill();
      p.x += p.vx;
      p.y += p.vy;
      if(p.x<0||p.x>W) p.vx *= -1;
      if(p.y<0||p.y>H) p.vy *= -1;
      if(mouse.x!==null){
        const dx = p.x - mouse.x, dy = p.y - mouse.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < MOUSE_DIST){
          const force = (MOUSE_DIST-dist)/MOUSE_DIST * 0.4;
          p.x += dx/dist * force;
          p.y += dy/dist * force;
        }
      }
    }
    for(let i=0;i<particles.length;i++){
      for(let j=i+1;j<particles.length;j++){
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < CONNECT_DIST){
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = baseColor + (0.12*(1-dist/CONNECT_DIST)) + ')';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', () => { resize(); initParticles(); });
  window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
  resize();
  initParticles();
  draw();
})();

initTheme(); paintTheme();
</script>
