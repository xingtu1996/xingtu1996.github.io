name: Collect licensed railway recordings
on:
  pull_request:
    paths: [".github/workflows/xiaobao-station-voice.yml"]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch the published Freesound audio previews
        run: |
          mkdir field
          python - <<'PY'
          from urllib.request import Request, urlopen
          from pathlib import Path
          import re, html
          sounds = [('horn','theplax',563299,12172648),('open','Yoyodaman234',341328,None),('close','Yoyodaman234',341329,None)]
          for name, artist, number, user_id in sounds:
              def read(url):
                  with urlopen(Request(url,headers={'User-Agent':'XingTu-Playgarden/1.0 licensed media import'}), timeout=20) as f:
                      return f.read()
              page = f'https://freesound.org/people/{artist}/sounds/{number}/'
              try:
                  body = html.unescape(read(page).decode()).replace('\\/','/')
                  match = re.search(rf'{number}_(\d+)-',body)
                  if match:
                      user_id = match[1]
              except Exception as error:
                  print(name,str(error))
              if not user_id:
                  print('Missing preview',name)
                  continue
              url=f'https://cdn.freesound.org/previews/{number//1000}/{number}_{user_id}-hq.mp3'
              data=read(url)
              assert len(data)>5000 and not data.lstrip().startswith(b'<')
              Path('field', name+'.mp3').write_bytes(data)
              print(name, url, len(data))
          assert Path('field/horn.mp3').exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: field-recordings
          path: field/*.mp3
          retention-days: 2
