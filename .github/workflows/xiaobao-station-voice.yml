name: Render station announcements
on:
  pull_request:
    paths:
      - ".github/workflows/xiaobao-station-voice.yml"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render Mandarin MP3 clips
        run: |
          set -eu
          python -m pip install 'sherpa-onnx==1.12.26' 'soundfile==0.13.1' 'numpy<3' 'imageio-ffmpeg==0.6.0'
          curl --fail --location --retry 2 -o model.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_1.tar.bz2
          tar -xf model.tar.bz2
          mkdir voice
          python - <<'PY'
          import subprocess
          import imageio_ffmpeg
          import sherpa_onnx as s
          import soundfile as sf
          root = "kokoro-multi-lang-v1_1"
          import numpy as np
          voice = s.OfflineTtsKokoroModelConfig(model=f"{root}/model.onnx", voices=f"{root}/voices.bin", tokens=f"{root}/tokens.txt", data_dir=f"{root}/espeak-ng-data", lexicon=f"{root}/lexicon-us-en.txt,{root}/lexicon-zh.txt")
          tts = s.OfflineTts(s.OfflineTtsConfig(model=s.OfflineTtsModelConfig(kokoro=voice, num_threads=3)))
          scripts = {"softHello":[[3,0.92,"小宝，你好呀！来玩吧！"]],"softTurn":[[3,0.92,"轮到你啦！"]],"softThanks":[[3,0.92,"谢谢你！"]],"softAgain":[[3,0.92,"没关系，再试一次吧！"]],"softBye":[[3,0.92,"玩得开心！下次见。"]],"brightHello":[[12,1.05,"小宝，你好呀！来玩吧！"]],"brightTurn":[[12,1.05,"轮到你啦！"]],"brightThanks":[[12,1.05,"谢谢你！"]],"brightAgain":[[12,1.05,"没关系，再试一次吧！"]],"brightBye":[[12,1.05,"玩得开心！下次见。"]],"steadyHello":[[60,0.94,"小宝，你好呀！来玩吧！"]],"steadyTurn":[[60,0.94,"轮到你啦！"]],"steadyThanks":[[60,0.94,"谢谢你！"]],"steadyAgain":[[60,0.94,"没关系，再试一次吧！"]],"steadyBye":[[60,0.94,"玩得开心！下次见。"]]}
          rate = tts.sample_rate
          def quiet(seconds):
              return np.zeros(round(seconds * rate))
          def bell(freq, seconds):
              t = np.arange(round(seconds * rate)) / rate
              return 0.115 * np.minimum(t / 0.018, 1) * np.exp(-8*t) * (np.sin(2*np.pi*freq*t) + 0.21*np.sin(4*np.pi*freq*t))
          def arrive():
              t = np.arange(round(0.95*rate)) / rate
              pitch = 315 + 56 * np.sin(np.pi*t / 0.95)
              phase = 2*np.pi*np.cumsum(pitch)/rate
              return 0.13 * np.sin(np.pi*t/0.95)**2 * (np.sin(phase)+0.32*np.sin(2*phase)+0.10*np.sin(3*phase))
          for name, lines in scripts.items():
              parts = []
              if name in ("depart","approach"):
                  parts.extend([bell(660,0.24),bell(495,0.36),quiet(0.12)])
              for number, (sid,speed,text) in enumerate(lines):
                  audio = tts.generate(text, sid=sid, speed=speed)
                  samples = np.asarray(audio.samples)
                  idx = np.flatnonzero(np.abs(samples)>0.008)
                  assert len(idx)>rate*0.08
                  samples = samples[max(0,idx[0]-rate//18):idx[-1]+rate//12]
                  parts.append(samples)
                  if number == 0:
                      if name == "welcome":
                          parts.extend([quiet(0.20),arrive(),quiet(0.35)])
                      else:
                          parts.append(quiet(0.45))
              sf.write("clip.wav", np.concatenate(parts+[quiet(0.12)]), rate)
              subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), "-loglevel", "error", "-y", "-i", "clip.wav", "-af", "loudnorm=I=-17:TP=-2:LRA=8", "-ar", "44100", "-ac", "1", "-codec:a", "libmp3lame", "-b:a", "64k", f"voice/{name}.mp3"], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xiaobao-voice-presets
          path: voice/*.mp3
          retention-days: 2
