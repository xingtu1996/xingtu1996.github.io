name: Render station announcements
on:
  pull_request:
    paths:
      - ".github/workflows/xiaobao-station-voice.yml"
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Render Mandarin MP3 clips
        run: |
          set -eu
          python -m pip install 'sherpa-onnx==1.12.14' 'soundfile==0.13.1' 'numpy<3' 'imageio-ffmpeg==0.6.0'
          curl --fail --location --retry 2 -o model.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-icefall-zh-aishell3.tar.bz2
          tar -xf model.tar.bz2
          mkdir voice
          python - <<'PY'
          import subprocess
          import imageio_ffmpeg
          import sherpa_onnx as s
          import soundfile as sf
          root = "vits-icefall-zh-aishell3"
          voice = s.OfflineTtsVitsModelConfig(model=f"{root}/model.onnx", tokens=f"{root}/tokens.txt", lexicon=f"{root}/lexicon.txt")
          tts = s.OfflineTts(s.OfflineTtsConfig(model=s.OfflineTtsModelConfig(vits=voice,num_threads=2)))
          clips = {"driver":"小司机，你好！请看看信号灯，我们准备出发。","depart":"女士们，先生们，欢迎乘车。本次列车开往彩虹车站。","approach":"旅客朋友们，前方到站，彩虹车站。","arrive":"彩虹车站到了。请等车停稳，再下车。","doors":"车门就要关上了。小手请离开车门。","welcome":"高铁来了！小朋友，请站在黄线后面，向列车挥挥手吧。"}
          for name, text in clips.items():
              audio = tts.generate(text, sid=21, speed=0.96)
              assert len(audio.samples) > audio.sample_rate
              sf.write("clip.wav", audio.samples, audio.sample_rate)
              subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), "-loglevel", "error", "-y", "-i", "clip.wav", "-af", "loudnorm=I=-17:TP=-2:LRA=8", "-ar", "44100", "-ac", "1", "-codec:a", "libmp3lame", "-b:a", "64k", f"voice/{name}.mp3"], check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: station-announcements
          path: voice/*.mp3
          retention-days: 2
