name: Test Xiaobao station playback
on:
  push:
    branches: [main]
    paths: ["xiaobao/**"]
  pull_request:
    paths: [".github/workflows/xiaobao-playback-test.yml", "xiaobao/**"]
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install 'playwright==1.55.0' && python -m playwright install --with-deps chromium webkit
      - name: Mobile controls and offline audio
        run: |
          python - <<'PY'
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from threading import Thread
          import socket
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              for engine, profile in [('webkit','iPhone 13'), ('webkit','iPad (gen 7)'), ('chromium','Pixel 7')]:
                  server = ThreadingHTTPServer(('127.0.0.1', 0), SimpleHTTPRequestHandler)
                  Thread(target=server.serve_forever, daemon=True).start()
                  port = server.server_port
                  browser = getattr(p, engine).launch()
                  ctx = browser.new_context(**p.devices[profile])
                  page = ctx.new_page()
                  errors = []
                  page.on('pageerror', lambda e: errors.append(str(e)))
                  page.add_init_script("""{
                    const OriginalAudio = window.Audio;
                    window.Audio = function(...args) {
                      const a = new OriginalAudio(...args); window.testPlayer = a; return a;
                    };
                  }""")
                  url = f'http://127.0.0.1:{port}/xiaobao/#radio'
                  page.goto(url)
                  page.wait_for_function("navigator.serviceWorker.controller !== null")
                  assert page.title() == '小宝乐园'
                  page.locator('#hello').tap()
                  page.wait_for_function("testPlayer.currentSrc.endsWith('/softHello.mp3') && !testPlayer.paused && testPlayer.currentTime > 0.12")
                  assert page.evaluate("""() => {
                      const region = document.querySelector('.game');
                      const event = new Event('touchstart', {bubbles:true,cancelable:true});
                      Object.defineProperty(event, 'touches', {value:[{},{}]});
                      return getComputedStyle(region).touchAction === 'pan-y' && !region.dispatchEvent(event);
                  }""")
                  def first_screen():
                      size = page.viewport_size
                      page.set_viewport_size({"width": 320, "height": 568})
                      for name, control in [('blocks','[data-action=drop]'),('balls','#launcher'),('rail','[data-rail=horn]'),('radio','[data-clip=welcome]'),('candy','#launcher'),('draw','#draw-prompt')]:
                          page.locator('#'+name).tap()
                          page.evaluate("window.scrollTo(0, 0)")
                          rect = page.locator(control).bounding_box()
                          assert rect and rect['y'] + rect['height'] <= 568 and rect['height'] >= 44, (profile,name,rect)
                      page.set_viewport_size({"width": 1024, "height": 568})
                      page.locator('#blocks').tap()
                      page.evaluate("window.scrollTo(0, 0)")
                      for selector in ['#grid','#block-message','[data-action=drop]']:
                          rect = page.locator(selector).bounding_box()
                          assert rect and rect['y'] + rect['height'] <= 568, (profile,'tablet landscape',selector,rect)
                      page.set_viewport_size(size)
                      page.locator('#radio').tap()
                      page.evaluate("window.scrollTo(0,0)")
                  first_screen()
                  def hear(key):
                      page.locator('[data-clip="'+key+'"]').tap()
                      page.wait_for_function("key => testPlayer.currentSrc.endsWith('/'+key+'.mp3') && !testPlayer.paused && testPlayer.currentTime > 0.2", arg=key, timeout=9000)
                  for key in ['welcome','driver','approach','arrive','doors','trainReal','metro','bus','pass','depart']:
                      hear(key)
                  assert '开往彩虹车站' in page.locator('#radio-caption').inner_text()
                  assert page.locator('#music').get_attribute('aria-pressed') == 'true'
                  for _ in range(2):
                      hear('welcome')
                  page.wait_for_function("!music.paused && music.currentTime > 0.2 && musicGain.gain.value < 0.1")
                  page.wait_for_function("testPlayer.ended && musicGain.gain.value > 0.21")
                  page.locator('#music').tap()
                  assert page.evaluate('music.paused')
                  page.locator('#sound').tap()
                  page.locator('[data-clip=welcome]').tap()
                  assert page.evaluate('testPlayer.paused') and '声音已关' in page.locator('#voice-status').inner_text()
                  page.locator('#sound').tap()
                  hear('welcome')
                  page.locator('#radio-horn').tap()
                  page.wait_for_function("testPlayer.currentSrc.endsWith('/horn.mp3') && testPlayer.currentTime > 0.15")
                  page.locator('#rail').tap()
                  assert page.evaluate('testPlayer.paused')
                  page.locator('[data-rail=go]').tap()
                  page.wait_for_function("testPlayer.currentSrc.endsWith('/depart.mp3') && testPlayer.currentTime > 0.2 && !testPlayer.paused")
                  page.locator('[data-rail=stop]').tap()
                  page.locator('[data-dest=houma]').tap()
                  page.locator('[data-family=grandma]').tap()
                  page.wait_for_function("testPlayer.currentSrc.endsWith('/pickGrandma.mp3') && testPlayer.currentTime > 0.15")
                  for key in ['nana','dad','grandpa','team','send','parents','grands','outbound','baby','together','grandma']:
                      page.locator('[data-family="'+key+'"]').tap()
                      page.wait_for_function("name => testPlayer.currentSrc.endsWith('/'+name+'.mp3') && testPlayer.currentTime > 0.12",arg='pick'+key.capitalize())
                  page.locator('[data-rail=go]').tap()
                  page.wait_for_function("testPlayer.currentSrc.endsWith('/houmaTrip.mp3') && testPlayer.currentTime > 0.15")
                  page.locator('[data-rail=fast]').tap()
                  page.locator('[data-rail=fast]').tap()
                  page.wait_for_function("testPlayer.currentSrc.endsWith('/houmaEnd.mp3') && testPlayer.currentTime > 0.15",timeout=22000)
                  page.locator('[data-rail=door]').tap()
                  page.wait_for_function("testPlayer.currentSrc.endsWith('/grandma.mp3') && testPlayer.currentTime > 0.15")
                  page.locator('#pause').tap()
                  assert page.evaluate('testPlayer.paused')
                  page.locator('#resume').tap()
                  page.locator('#blocks').tap()
                  page.locator('[data-action=drop]').tap()
                  assert page.locator('#score b').inner_text() == '1'
                  assert '消掉一排' in page.locator('#block-message').inner_text()
                  stones = page.locator('.tile.falling').evaluate_all('(xs) => xs.map(e => e.offsetTop)')
                  page.wait_for_timeout(2450)
                  assert stones == page.locator('.tile.falling').evaluate_all('(xs) => xs.map(e => e.offsetTop)')
                  page.wait_for_function("before => [...document.querySelectorAll('.tile.falling')].some((tile,i) => tile.offsetTop !== before[i])",arg=stones,timeout=5000)
                  box = page.locator('#grid').bounding_box()
                  page.touchscreen.tap(box['x']+box['width']*0.12,box['y']+box['height']*0.55)
                  assert page.evaluate('piece.x === 0')
                  assert page.locator('#controls').bounding_box()['y'] > page.locator('#grid').bounding_box()['y']
                  page.locator('[data-action=left]').tap()
                  page.locator('[data-action=rotate]').tap()
                  page.locator('#balls').tap()
                  frog = page.locator('.marble.frog').last
                  frog.tap()
                  page.wait_for_function("!document.querySelector('.projectile:not([hidden])')")
                  for _ in range(24):
                      if not page.locator('.marble:not(.empty)').count():
                          break
                      page.locator('#launcher').tap()
                      page.wait_for_function("document.querySelector('#projectile').hidden")
                  assert page.locator('.marble:not(.empty)').count() == 0
                  page.locator('#launcher').tap()
                  assert page.locator('.marble:not(.empty)').count() == 24
                  assert page.evaluate("document.documentElement.scrollWidth <= innerWidth")
                  page.locator('#candy').tap()
                  for level in range(1,7):
                      assert f'第 {level} 关' in page.locator('#ball-hint').inner_text()
                      assert page.evaluate("""() => {
                          while (marbleBoard.some(value => value !== null)) {
                              const index = marbleBoard.findIndex(value => value !== null);
                              finishShot(matchingGroup(index), index);
                          }
                          return marbleBoard.every(value => value === null);
                      }""")
                      page.locator('#launcher').tap()
                  page.locator('#draw').tap()
                  canvas = page.locator('#drawing')
                  box = canvas.bounding_box()
                  page.mouse.move(box['x']+30,box['y']+30)
                  page.mouse.down()
                  page.mouse.move(box['x']+70,box['y']+70)
                  page.mouse.up()
                  assert page.evaluate("ink.getImageData(0,0,drawing.width,drawing.height).data.some((v,i) => i%4===3 && v>0)")
                  page.locator('#draw-prompt').tap()
                  page.locator('#draw-reveal').tap()
                  assert '轮到' in page.locator('#draw-message').inner_text()
                  page.locator('#draw-reveal').tap()
                  assert '答案' in page.locator('#draw-message').inner_text()
                  page.locator('#parent-open').tap()
                  page.locator('#voice-style').select_option('bright')
                  page.locator('#voice-preview').tap()
                  page.wait_for_function("testPlayer.currentSrc.endsWith('/brightHello.mp3') && testPlayer.currentTime > 0.10")
                  page.locator('#parent-close').tap()
                  page.locator('#radio').tap()
                  page.locator('[data-line=Thanks]').tap()
                  page.wait_for_function("testPlayer.currentSrc.endsWith('/brightThanks.mp3') && testPlayer.currentTime > 0.10")
                  page.locator('#parent-open').tap()
                  page.locator('#mother-number').fill('00000000000')
                  page.locator('[data-practice=mother]').tap()
                  assert '零、零' in page.locator('#practice-status').inner_text()
                  assert not page.evaluate("JSON.stringify(localStorage).includes('00000000000')")
                  page.locator('#lock-touch').uncheck()
                  assert not page.locator('.playgarden').evaluate("node => node.classList.contains('touch-locked')")
                  page.locator('#lock-touch').check()
                  page.locator('#parent-close').tap()
                  page.wait_for_function("!document.querySelector('#mother-number').value")
                  if engine == 'chromium':
                      page.locator('#parent-open').tap()
                      page.evaluate("""() => {
                          navigator.mediaDevices.getUserMedia = async () => {
                              const audio = new AudioContext();
                              await audio.resume();
                              const destination = audio.createMediaStreamDestination();
                              const oscillator = audio.createOscillator();
                              oscillator.connect(destination);
                              oscillator.start();
                              window.fakeRecording = { audio, stream: destination.stream };
                              return destination.stream;
                          };
                      }""")
                      page.locator('#record-start').tap()
                      page.wait_for_function("!document.querySelector('#record-stop').disabled")
                      page.wait_for_timeout(300)
                      page.locator('#record-stop').tap()
                      page.wait_for_function("document.querySelector('#record-play').src.startsWith('blob:')")
                      page.locator('#parent-close').tap()
                      page.wait_for_function("!document.querySelector('#record-play').getAttribute('src') && fakeRecording.stream.getTracks().every(t=>t.readyState==='ended')")
                      page.evaluate("fakeRecording.audio.close()")
                  server.shutdown()
                  server.server_close()
                  with socket.socket() as probe:
                      assert probe.connect_ex(('127.0.0.1', port)) != 0
                  print(engine, profile, 'online playback passed; origin stopped', flush=True)
                  page.close()
                  page = ctx.new_page()
                  page.on('pageerror', lambda e: errors.append(str(e)))
                  page.add_init_script("const NativeAudio = window.Audio; window.Audio = function(...args) {return window.testPlayer=new NativeAudio(...args)}")
                  page.goto(url)
                  page.locator('#hello').tap()
                  page.wait_for_function("testPlayer.currentSrc.endsWith('/brightHello.mp3') && testPlayer.currentTime > 0.12")
                  hear('welcome')
                  assert '高铁来了' in page.locator('#radio-caption').inner_text()
                  assert page.locator('#music').get_attribute('aria-pressed') == 'false'
                  page.locator('#rail').tap()
                  page.locator('[data-family=dad]').tap()
                  page.wait_for_function("testPlayer.currentSrc.endsWith('/pickDad.mp3') && testPlayer.currentTime > 0.12")
                  page.locator('#radio').tap()
                  for key in ['depart','approach','arrive','doors','driver','trainReal','metro','bus','pass']:
                      hear(key)
                  bounds = page.evaluate("""async () => {const r=await fetch('./voice/welcome.mp3',{headers:{Range:'bytes=0-1'}});return [r.status,(await r.arrayBuffer()).byteLength]}""")
                  assert bounds == [206,2] and not errors, (bounds,errors)
                  print(engine, profile, 'PASS: local recordings, background music, mute, pickup trip, frog removal, clean board and offline restart')
                  browser.close()
          PY
      - name: Verify the deployed GitHub Pages version and MP3
        if: github.event_name == 'push'
        run: |
          set -eu
          for attempt in $(seq 1 20); do
            if curl -fsSL "https://xingtu1996.github.io/xiaobao/?verify=${GITHUB_SHA}&attempt=$attempt" -o /tmp/xiaobao-live.html && grep -q 'application-version" content="1.6.0"' /tmp/xiaobao-live.html; then
              curl -fsSL "https://xingtu1996.github.io/xiaobao/voice/horn.mp3?verify=${GITHUB_SHA}" -o /tmp/xiaobao-live-horn.mp3
              cmp /tmp/xiaobao-live-horn.mp3 xiaobao/voice/horn.mp3
              curl -fsSL "https://xingtu1996.github.io/xiaobao/voice/pickDad.mp3?verify=${GITHUB_SHA}" -o /tmp/xiaobao-live-dad.mp3
              cmp /tmp/xiaobao-live-dad.mp3 xiaobao/voice/pickDad.mp3
              curl -fsSL "https://xingtu1996.github.io/xiaobao/voice/softHello.mp3?verify=${GITHUB_SHA}" -o /tmp/xiaobao-live-hello.mp3
              cmp /tmp/xiaobao-live-hello.mp3 xiaobao/voice/softHello.mp3
              echo "GitHub Pages 1.6.0 and live horn MP3 verified"
              exit 0
            fi
            sleep 10
          done
          exit 1
