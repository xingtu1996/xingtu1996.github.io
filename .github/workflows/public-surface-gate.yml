name: Public surface gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed public content
        uses: actions/checkout@v4
      - name: Audit contact info, private repo links and local HTML references
        run: python3 scripts/check_public_surface.py
